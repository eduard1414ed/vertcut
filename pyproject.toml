[build-system]
# 77 — первая, что понимает `license = "MIT"` строкой (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vertcut"
version = "0.2.0"
description = "Cut long videos into vertical clips with subtitles, on your own computer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

# Вилка версий, а не одна.
#
# Нарезатор держит ровно 3.11, и причина там была настоящая: у ctranslate2
# (движок распознавания) не было колёс под 3.12. Проверено 1 сентября
# 2026 года: у ctranslate2 4.8.2 на PyPI лежат готовые сборки под 3.10,
# 3.11, 3.12, 3.13 и 3.14, в том числе под arm64 macOS. Замок снят.
#
# Верхняя граница стоит не от ctranslate2, а от остальных: под самый
# свежий питон колёса подъезжают последними, и человек, у которого стоит
# только он, получил бы сборку из исходников вместо установки. Поднимать
# её надо тогда, когда проверено, что весь список ставится.
#
# 3.14 впущен в 26-й сессии (9 октября 2026): готовые колёса всего списка
# нашлись под 3.11–3.14 для macOS arm64 и x86_64, Windows x64 и Linux x64
# (`pip install --dry-run --only-binary=:all:` с чужой платформой),
# а на маке все проверки прошли питоном 3.14 из Homebrew. Причина та
# же, что у вилки: `python3` из свежего Homebrew — уже 3.14, и человек
# с одним им получал отказ на первой же команде README.
requires-python = ">=3.11,<3.15"

dependencies = [
    # Распознавание речи. MIT; тянет за собой ctranslate2 (MIT),
    # tokenizers, huggingface-hub и onnxruntime.
    "faster-whisper>=1.1",
    # Чтение звука — его зовёт распознавание, не мы. Строка стоит ради
    # ГРАНИЦЫ, а не ради зависимости: av 19 (29 сентября 2026) убрал
    # довод `metadata_errors`, который faster-whisper 1.2.1 (последний)
    # передаёт, — и разбор падал на первом же звуке у КАЖДОЙ свежей
    # установки, включая установщик. Найдено в 27-й сессии живым
    # разбором; проверки этого не видели — они не слушали звук, теперь
    # слушают (`tests/test_align.py`, декодирование настоящего файла).
    # Снимать границу — когда faster-whisper научится av 19.
    "av>=11,<19",
    # Числа: спаны, метрики, кадры как матрицы.
    "numpy>=1.26",
    # Движок для детектора лиц. Он же приезжает вместе с распознаванием,
    # но объявлен здесь своей строкой: мы зовём его напрямую, и молчаливо
    # опираться на чужую зависимость — способ однажды остаться без неё.
    "onnxruntime>=1.17",
    # Рисование субтитров.
    "pillow>=10.0",
    # Настройки и профили: числа долями кадра лежат в yaml.
    "pyyaml>=6.0",
]

# ЧЕГО ЗДЕСЬ БОЛЬШЕ НЕТ, и почему это стоило работы.
#
# `opencv-python-headless` (119 МБ) и `scenedetect` (1 МБ) ушли
# в шестой сессии. Пользовался ими ОДИН детектор склеек; детектор лиц
# отвязали от opencv ещё в первой.
#
# Уйти было нельзя, пока метрика чужая: порог склеек 35 замерен ИМЕННО
# на ней, глазами, по шестнадцати спорным границам. Поэтому метрика
# не написана заново, а ПЕРЕСЧИТАНА без opencv — и доказано это
# единственным способом, который что-то значит: прогоном по тем же
# четырём видео с требованием тех же границ. 70 тысяч кадров, ноль
# расхождений; подробности в `vertcut/scenes.py`.
#
# Что за это получено: минус 120 МБ поставки, минус две зависимости
# и минус две строки чужой ложной тревоги при каждом запуске — обе
# библиотеки везли по своей копии части ffmpeg, которой не пользовалась
# ни одна.
#
# Что за это заплачено: стадия склеек стала медленнее — 40 секунд
# против 7 на девятнадцатиминутном видео.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vertcut = "vertcut.cli:main"

[tool.setuptools]
# Подпапки перечисляются поимённо, а не собираются поиском. Поиск
# однажды подберёт лишнее (тесты, черновики) или не подберёт нужное,
# и узнается это только на чужой машине, где сервис уже поставлен.
packages = ["vertcut", "vertcut.web"]

# Обвес едет в поставку вместе с кодом.
#
# **Это замер, а не порядок ради порядка.** Шестая сессия собрала
# поставку и посмотрела, что внутри: там был только код — 51 файл,
# и ни одного шрифта, профиля, веса детектора или файла страницы.
# То есть человек, поставивший сервис обычным способом, получил бы
# программу, которая не рисует субтитров и не открывает экрана.
#
# У автора это не всплывало никогда: у него установка «на месте»,
# где обвес лежит рядом с кодом и находится сам собой.
#
# **Папки перечислены поимённо и с глубиной, а не одним `assets/*`.**
# Звёздочка не спускается внутрь: `web/js/screens/` так не попал бы,
# и экран у чужого человека умер бы на первом же щелчке. Завели новую
# папку в обвесе — впишите её сюда; есть проверка, которая краснеет,
# если под какой-нибудь файл обвеса не нашлось строки.
[tool.setuptools.package-data]
vertcut = [
    "assets/*.yaml",
    "assets/*.txt",
    "assets/fonts/*",
    "assets/models/*",
    "assets/web/*.html",
    "assets/web/*.css",
    "assets/web/js/*.js",
    "assets/web/js/screens/*.js",
    "assets/web/fonts/*",
]
